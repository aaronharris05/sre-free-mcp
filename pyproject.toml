[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "sre-free-mcp"
version = "0.1.0"
description = "Self-hosted SRE platform for GCP, callable by any AI agent via MCP server. Anomaly detection, retry orchestration with circuit breakers, cost + PII + IAM audits — Cloud Run + BigQuery, Terraform-deployed."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Aaron Harris", email = "aaronharris05@gmail.com" }]
keywords = [
    "mcp",
    "mcp-server",
    "sre",
    "gcp",
    "google-cloud",
    "cloud-run",
    "bigquery",
    "terraform",
    "observability",
    "monitoring",
    "anomaly-detection",
    "audit",
    "circuit-breaker",
    "retry",
    "ai-agents",
    "claude",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "mcp>=1.2.0",
    "google-cloud-bigquery>=3.25",
    "google-cloud-run>=0.10",
    "google-cloud-secret-manager>=2.20",
    "google-cloud-resource-manager>=1.13",
    "google-cloud-monitoring>=2.20",
    "google-cloud-scheduler>=2.13",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "click>=8.1",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
gemini = ["google-genai>=0.5"]
# Heavy-tail GCP audit deps — kept out of the default install so the
# container stays small for users who only run the core audits.
security = ["google-cloud-securitycenter>=1.30"]
pii = ["google-cloud-dlp>=3.20"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[project.scripts]
sre-runner = "sre_free_mcp.runner.__main__:main"
sre-mcp-server = "sre_free_mcp.mcp_server.server:main"

[project.urls]
Homepage = "https://github.com/aaronharris05/sre-free-mcp"
Repository = "https://github.com/aaronharris05/sre-free-mcp"
Issues = "https://github.com/aaronharris05/sre-free-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sre_free_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
